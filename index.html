il production belongs in a later stage.</li></ul><p><b>Pedagogical rationale:</b> Your blueprint describes Rahim &amp; Wahi (2023) as emphasising basic sentence structures, SVO and subject–verb agreement, supported by visual tools and a low-anxiety environment. This presentation applies that supplied rationale; not all example sentences are SVO.</p><p class="small">The revised six-part structure is used consistently. Salutation, Main Body (including the answer and reason), and Closing are taught alongside the three email header fields. This simulated client sends nothing and stores no pupil data. The name and answers exist only in page memory and clear on reload or reset. Teacher Mode is a separate information panel, not a password-protected account.</p></div>`;$('#teacher').showModal()}

function normaliseWord(raw){return raw.toLowerCase().trim().replace(/[?.!]/g,'').replace(/^(what does |what is |meaning of |define |how do you say |how to pronounce )/,'').replace(/ mean$/,'').trim()}
function googleWordLinks(word){const q=encodeURIComponent(word);return `<div class="word-links"><a href="https://www.google.com/search?q=${q}+meaning+for+kids&safe=active" target="_blank" rel="noopener noreferrer">Google meaning ↗</a><a href="https://www.google.com/search?tbm=isch&q=${q}+for+kids&safe=active" target="_blank" rel="noopener noreferrer">Google pictures ↗</a></div>`}
function renderWordConversation(){const panel=$('#wordConversation');if(!panel)return;panel.innerHTML=wordMessages.map(m=>{const e=m.entry;return `<div class="word-user">${escapeHTML(m.word)}</div><div class="word-bot">${m.photo?`<img class="web-photo" src="${escapeHTML(m.photo.url)}" alt="${escapeHTML(m.word)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.textContent='Picture could not load. Try Google pictures below.'"><p class="word-image-credit"><a href="${escapeHTML(m.photo.page)}" target="_blank" rel="noopener noreferrer">Image source</a>${m.photo.credit?' · '+escapeHTML(m.photo.credit):''}${m.photo.license?` · <a href="${escapeHTML(m.photo.license)}" target="_blank" rel="noopener noreferrer">Licence</a>`:''}</p>`:e?.visual?`<div class="word-visual" role="img" aria-label="Picture clue for ${escapeHTML(m.word)}">${e.visual}</div>`:''}<h3>${escapeHTML(m.word)}</h3>${m.phonetic?`<div class="word-phonetic">${escapeHTML(m.phonetic)}</div>`:''}${e?`<p>${escapeHTML(e.meaning)}</p>${e.example?`<p class="word-example">${escapeHTML(e.example)}</p>`:''}<p class="dictionary-source">${e.source?`<a href="${escapeHTML(e.source)}" target="_blank" rel="noopener noreferrer">${e.online?'Online dictionary source':'Definition reference'}</a>`:'Simple lesson definition'}</p>`:`<p>${m.pending?'Looking for this word…':'No definition found. Check the spelling, try one word, or use Google meaning below.'}</p>`}<button data-word-say="${escapeHTML(m.word)}">🔊 Listen slowly</button>${m.extra?`<details><summary>More dictionary meanings</summary>${m.extra.map(d=>`<p>${escapeHTML(d)}</p>`).join('')}</details>`:''}${m.imageStatus?`<p class="word-status">${m.imageStatus}</p>`:''}${googleWordLinks(m.word)}</div>`}).join('');panel.querySelectorAll('[data-word-say]').forEach(b=>b.onclick=()=>speakText(b.dataset.wordSay));panel.scrollTop=panel.scrollHeight}
lookupWord=async function(raw){const word=normaliseWord(raw);if(!word)return;if(word.length>45||!/^[-a-z\s']+$/.test(word)){wordNotice('Type an English word or short phrase.');return}lastWord=word;const cached=wordCache.get(word);const item={word,entry:dictionary[word]?{...dictionary[word]}:null,photo:knownPhotos[word]||null,pending:!dictionary[word],...cached};wordMessages.push(item);if(wordMessages.length>8)wordMessages.shift();$('#wordInput').value='';renderWordConversation();if(cached)return;
const tasks=[];
if(!item.entry){tasks.push((async()=>{try{const data=await fetchWordJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));const record=data.find(r=>r.meanings?.length)||data[0];const defs=record.meanings.flatMap(m=>m.definitions.map(d=>({...d,part:m.partOfSpeech})));const first=defs.find(d=>d.definition);if(!first)throw Error('No meaning');item.entry={meaning:first.definition,example:first.example||'',source:safeWebURL(record.sourceUrls?.[0])||'https://dictionaryapi.dev/',online:true};item.phonetic=record.phonetic||record.phonetics?.find(p=>p.text)?.text||'';item.extra=defs.slice(1,3).map(d=>d.part+': '+d.definition);}catch{item.failed=true}finally{item.pending=false;renderWordConversation()}})());}
if(!item.photo){const title=pictureTopics[word]||(!item.entry?word:null);if(title)tasks.push((async()=>{try{const query=new URLSearchParams({action:'query',format:'json',origin:'*',redirects:'1',prop:'pageimages',piprop:'thumbnail|name',pithumbsize:'500',pilicense:'free',titles:title});const data=await fetchWordJSON('https://en.wikipedia.org/w/api.php?'+query);const page=Object.values(data.query?.pages||{}).find(p=>p.thumbnail?.source);if(page){const fileName=page.pageimage;const fileQuery=new URLSearchParams({action:'query',format:'json',origin:'*',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'500',titles:'File:'+fileName});const fileData=await fetchWordJSON('https://commons.wikimedia.org/w/api.php?'+fileQuery);const info=Object.values(fileData.query?.pages||{}).find(p=>p.imageinfo)?.imageinfo?.[0];const plain=s=>s?String(s).replace(/<[^>]*>/g,'').replace(/&[^;]+;/g,' ').trim():'';const url=safeWebURL(info?.thumburl||page.thumbnail.source);if(url)item.photo={url,page:safeWebURL(info?.descriptionurl)||'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(fileName),credit:[plain(info?.extmetadata?.Artist?.value).slice(0,120),plain(info?.extmetadata?.LicenseShortName?.value)].filter(Boolean).join(' · '),license:safeWebURL(info?.extmetadata?.LicenseUrl?.value||'')};}else item.imageStatus='No matching photo found. Try Google pictures.'}catch{item.imageStatus='Online pictures are unavailable. Try Google pictures.'}renderWordConversation()})());}
await Promise.allSettled(tasks);item.pending=false;wordCache.set(word,{entry:item.entry,photo:item.photo,phonetic:item.phonetic,extra:item.extra,imageStatus:item.imageStatus});renderWordConversation();};
const richerHelper=ensureWordHelper;ensureWordHelper=function(){richerHelper();const n=$('#wordNotice');if(n)n.textContent='Try any English word. Online results need internet. Google links open a new tab.';const input=$('#wordInput');if(input)input.placeholder='Try: dolphin, curious, library';};
const richerReset=reset;reset=function(){wordMessages=[];richerReset();const p=$('#wordConversation');if(p)p.innerHTML=''};ensureWordHelper();

</script><script>
// navigation.js
const lessonSections=[0,1,2,4,5,6,7];
const revisedNavigationRender=render;
render=function(){revisedNavigationRender();$('#dots').innerHTML=lessonSections.map((s,i)=>`<button class="${s===section?'active':''}" aria-label="${i+1}. ${sections[s]}" ${s===section?'aria-current="step"':''} ${s===6&&!pals.every((_,m)=>readEmails[m]&&replyFinished(m))?'disabled':''} onclick="go(${s})"></button>`).join('');document.documentElement.style.setProperty('--p',((lessonSections.indexOf(section)+1)/lessonSections.length*100)+'%');};
const revisedGo=go;
go=function(n){if(n===3)n=section>3?2:4;if(n===6&&!pals.every((_,i)=>readEmails[i]&&replyFinished(i)))return;revisedGo(n)};
const revisedTeacher=openTeacher;
openTeacher=function(){revisedTeacher();$('#jump option[value="3"]')?.remove();const options=$('#jump')?.options;if(options)Array.from(options).forEach((option,i)=>{option.textContent=(i+1)+'. '+sections[+option.value]})};
render();

</script><script>
// Guided syntax lesson: received email -> six email components -> SVO -> SVA -> typing.
let grammarSeen=[false,false,false,false],grammarPage=0,grammarRevealed=false,grammarRole=-1,grammarPerson=0,grammarChoice=null,grammarCorrect=false;
const grammarLessons=[
{quote:'Last weekend, I went to Penang Hill and took many photos!',context:'Alex tells us about his trip. Let’s look at one idea from his sentence.',sentence:'I took many photos.',parts:['I','took','many photos'],tail:'',tailLabel:'',svoNote:'We have separated the photo idea to make it easier to see. “Took” tells us what happened in the past.',present:[['I','visit','Penang Hill'],['She','visits','Penang Hill']],agreement:'For regular visits in the present, use visit with I, you, we or they. With he, she or it, use visits.',check:'She ____ Penang Hill.',options:['visit','visits'],answer:1,correctSentence:'She visits Penang Hill.',place:['I','live','in Terengganu'],placeNote:'“In Terengganu” tells us where. It is a place phrase, not an object.'},
{quote:'On Wednesday, I read a storybook in the library.',context:'Sara tells us about a weekly activity. Find who, the action and what she reads.',sentence:'I read a storybook in the library.',parts:['I','read','a storybook'],tail:'in the library',tailLabel:'Place phrase',svoNote:'“A storybook” is what I read. “In the library” tells us where.',present:[['I','read','a storybook'],['She','reads','a storybook']],agreement:'For a regular activity, use I read and she reads. Add -s to read with he, she or it.',check:'She ____ a storybook.',options:['read','reads'],answer:1,correctSentence:'She reads a storybook.'},
{quote:'We eat delicious food, wear nice clothes, and spend happy time with our family.',context:'Aina shares three things her family does. Let’s look at the first one.',sentence:'We eat delicious food.',parts:['We','eat','delicious food'],tail:'',tailLabel:'',svoNote:'“We” means the people doing the action. “Delicious food” is what they eat.',present:[['We','eat','delicious food'],['She','eats','delicious food']],agreement:'Use we eat when talking about ourselves together. Use she eats when talking about one girl or woman.',check:'We ____ delicious food.',options:['eat','eats'],answer:0,correctSentence:'We eat delicious food.'},
{quote:'I have a cold today.',context:'Kumar tells us how he is feeling. A verb can tell us what someone has.',sentence:'I have a cold today.',parts:['I','have','a cold'],tail:'today',tailLabel:'Time word',svoNote:'“Have” is the verb. “A cold” tells us what Kumar has. “Today” tells us when.',present:[['I','have','a cold'],['He','has','a cold']],agreement:'Have is a special verb. Use I have, you have, we have and they have. Use he has, she has and it has.',check:'He ____ a cold.',options:['have','has'],answer:1,correctSentence:'He has a cold.'}
];
function clearGrammarPage(){grammarPage=0;grammarRevealed=false;grammarRole=-1;grammarPerson=0;grammarChoice=null;grammarCorrect=false}
const continueToTyping=beginTyping;
beginTyping=function(){emailGuideSeen[topic]=true;if(!grammarSeen[topic]){clearGrammarPage();learningPhase='grammar';section=5;render();window.scrollTo(0,0)}else continueToTyping()};
const grammarStartAnswering=startAnswering;
startAnswering=function(){if(emailGuideSeen[topic]&&!grammarSeen[topic]&&!replyFinished(topic)){clearGrammarPage();learningPhase='grammar';section=5;render();window.scrollTo(0,0);return}grammarStartAnswering()};
function grammarStage(page){grammarPage=page;grammarRole=-1;render();window.scrollTo(0,0)}
function grammarAnswer(i){grammarChoice=i;grammarCorrect=i===grammarLessons[topic].answer;render();if(grammarCorrect)chime()}
function finishGrammar(){if(!grammarCorrect)return;grammarSeen[topic]=true;learningPhase='typing';const q=writing[topic].findIndex(x=>!x.ok);helpQuestion=q<0?0:q;continueToTyping()}
function reopenGrammar(){clearGrammarPage();learningPhase='grammar';section=5;render();window.scrollTo(0,0)}
const grammarNames=['Subject','Verb','Object'];const grammarClasses=['gs-subject','gs-verb','gs-object'];
function grammarStrips(parts,interactive=true){return '<div class="gs-strips">'+parts.map((p,i)=>interactive?`<button class="gs-strip ${grammarClasses[i]} ${grammarRole===i?'gs-selected':''}" onclick="grammarRole=${i};render()"><small>${grammarNames[i]}</small><strong>${escapeHTML(p)}</strong></button>`:`<span class="gs-strip ${grammarClasses[i]}"><small>${grammarNames[i]}</small><strong>${escapeHTML(p)}</strong></span>`).join('')+'</div>'}
function grammarSVO(){const l=grammarLessons[topic];return `<div class="gs-heading"><span class="eyebrow">SVO · WORD ORDER</span><h1>Who + verb + what?</h1><p>${l.context}</p></div><div class="gs-source"><span>FROM ${pals[topic].name.toUpperCase()}’S EMAIL</span><p>${l.quote}</p></div><div class="gs-lesson"><p class="gs-model">${l.sentence}</p><button onclick="grammarRevealed=!grammarRevealed;render()">${grammarRevealed?'Hide':'Show'} the sentence parts</button>${grammarRevealed?`${grammarStrips(l.parts)}${l.tail?`<div class="gs-extra"><small>${l.tailLabel}</small> ${l.tail}</div>`:''}<div class="gs-role-help" role="status"><b>${grammarRole<0?'Subject → Verb → Object':grammarNames[grammarRole]}</b><br>${grammarRole<0?'Tap a coloured word group. See how the words work together.':['The subject tells us who or what the sentence is about. Here it is '+l.parts[0]+'.','The verb tells us the action or what someone does or has. Here it is '+l.parts[1]+'.','The object tells us what the verb is about. Here it is '+l.parts[2]+'.'][grammarRole]}</div><p class="gs-note">${l.svoNote}</p>`:''}</div>${l.place&&grammarRevealed?`<details class="gs-not-all"><summary>Does every sentence have an object?</summary><p>No. Look at this sentence:</p><div class="gs-strips"><span class="gs-strip gs-subject"><small>Subject</small><strong>I</strong></span><span class="gs-strip gs-verb"><small>Verb</small><strong>live</strong></span><span class="gs-strip gs-neutral"><small>Place phrase</small><strong>in Terengganu</strong></span></div><p>${l.placeNote}</p></details>`:''}<div class="gs-controls"><button onclick="learningPhase='guide';guidePart=-1;render()">← Email parts</button><button class="primary" onclick="grammarStage(1)" ${!grammarRevealed?'disabled':''}>Next: match the subject and verb →</button></div>`}
function grammarSVA(){const l=grammarLessons[topic],p=l.present[grammarPerson];return `<div class="gs-heading"><span class="eyebrow">SVA · SUBJECT–VERB AGREEMENT</span><h1>Match the subject and verb.</h1><p>When the subject changes, the verb may change too.</p></div><div class="gs-lesson"><div class="gs-person-tabs" aria-label="Choose a subject">${l.present.map((x,i)=>`<button class="${grammarPerson===i?'gs-active':''}" onclick="grammarPerson=${i};render()" aria-pressed="${grammarPerson===i}">${x[0]}</button>`).join('')}</div>${grammarStrips(p,false)}<p class="gs-note">${l.agreement}</p><div class="gs-contrast">${l.present.map(x=>`<p><b class="gs-subject-text">${x[0]}</b> <b class="gs-verb-text">${x[1]}</b> ${x[2]}.</p>`).join('')}</div>${topic===3?'<div class="gs-be"><b>Another useful match</b><p><span class="gs-subject-text">I</span> <span class="gs-verb-text">am</span> resting. &nbsp; <span class="gs-subject-text">He</span> <span class="gs-verb-text">is</span> resting.</p><p class="gs-note">Use I am and he/she/it is. Use you/we/they are.</p></div>':''}</div><div class="gs-quick-check"><span class="eyebrow">TRY ONE TOGETHER</span><h2>${l.check}</h2><div class="gs-options">${l.options.map((x,i)=>`<button onclick="grammarAnswer(${i})" class="${grammarChoice===i?(grammarCorrect?'gs-right':'gs-wrong'):''}" aria-pressed="${grammarChoice===i}">${x}</button>`).join('')}</div>${grammarChoice!==null?`<p class="gs-feedback ${grammarCorrect?'gs-feedback-right':'gs-feedback-wrong'}" role="status">${grammarCorrect?'Well done! '+l.correctSentence:'Good try! Look at the subject. '+(topic===3?'Use has with he.':topic===2?'Use eat with we.':'She needs the verb with -s.')+' Try again.'}</p>`:''}</div><div class="gs-controls"><button onclick="grammarStage(0)">← SVO</button><button class="primary" onclick="finishGrammar()" ${!grammarCorrect?'disabled':''}>I’m ready to write →</button></div>`}
const grammarRender=render;
render=function(){grammarRender();if(section===5&&learningPhase==='guide'){const b=$('.component-lesson .below-action .primary');if(b)b.textContent='Next: learn SVO & SVA →'}if(section===5&&emailGuideSeen[topic]&&!grammarSeen[topic]&&learningPhase==='typing')learningPhase='grammar';if(section===5&&learningPhase==='grammar'){$('#app').innerHTML=mailChrome(`<div class="reader-toolbar"><button onclick="backToInbox()">← Inbox</button><span class="small">${pals[topic].name} · Grammar ${grammarPage+1} of 2</span><button onclick="speakText(grammarPage===0?grammarLessons[topic].sentence:grammarLessons[topic].agreement)">🔊 Listen</button></div><div class="grammar-studio"><div class="gs-progress"><span>✓ Read email</span><span>✓ Email parts</span><b>3. SVO & SVA</b><span>4. Write a reply</span></div><div class="gs-legend"><span class="gs-subject">Subject</span><span class="gs-verb">Verb</span><span class="gs-object">Object</span><small>These colours show word roles inside a sentence.</small></div>${grammarPage===0?grammarSVO():grammarSVA()}</div>`);$('#next').disabled=true;$('#next').textContent='Complete the grammar step';}else if(section===5&&learningPhase==='typing'&&grammarSeen[topic]){const toolbar=$('.reader-toolbar');if(toolbar){const button=document.createElement('button');button.textContent='SVO & SVA help';button.onclick=reopenGrammar;toolbar.appendChild(button)}}};
const grammarTeacher=openTeacher;openTeacher=function(){grammarTeacher();const note=document.createElement('div');note.innerHTML='<h3>Integrated SVO and SVA lesson</h3><p>After pupils read the NPC email and explore its six components, guide them through the SVO and SVA lesson before typing. Purple marks subjects, green marks verbs and blue marks objects. Place and time phrases have separate neutral labels. The short check allows retries; vocabulary and typing supports remain available.</p>';$('#teachercontent').appendChild(note)};
const grammarReset=reset;reset=function(){grammarSeen=[false,false,false,false];clearGrammarPage();grammarReset()};render();

</script>
